[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rigveda-ai"
version = "0.2.0"
description = "A private, local-first filesystem assistant"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
docs = ["pymupdf>=1.24", "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]
media = ["faster-whisper>=1.1", "nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
voice = ["rigveda-ai[media]", "sounddevice>=0.5", "kokoro-onnx>=0.4", "sherpa-onnx>=1.12"]
watch = ["watchdog>=4"]
all = ["rigveda-ai[docs,media,voice,watch]"]
dev = ["pytest>=8"]

[project.scripts]
rigveda = "rigveda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
