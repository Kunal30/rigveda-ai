[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rigveda-ai"
version = "0.1.0"
description = "A private, local-first filesystem assistant"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
rigveda = "rigveda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
